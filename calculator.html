<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Final Mark Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    


    <div class="calc-card">
        <h2>CA Target Calculator</h2>
        <p class="subtitle">Calculate the mark you need in the final exam.</p>

        <div class="input-group">
            <label for="caObtained">CA Marks Obtained</label>
            <input type="number" id="caObtained" placeholder="e.g. 45">
        </div>

        <div class="input-group">
            <label for="caTotal">CA Total Marks</label>
            <input type="number" id="caTotal" placeholder="e.g. 60">
        </div>

        <div class="input-group">
            <label for="caWeight">CA Weight (%)</label>
            <input type="number" id="caWeight" placeholder="e.g. 40">
        </div>

        <div class="input-group">
            <label for="targetMark">Target Grade</label>
            <select id="targetMark">
               <div class="input-group">
    <label for="targetMark">Target Grade</label>
               <option value="85">A+</option>
               <option value="75">A</option>
               <option value="70">A-</option>
               <option value="65">B+</option>
               <option value="60">B</option>
               <option value="55">B-</option>
               <option value="50">C+</option>
               <option value="45">C</option>
            </select>
        </div>

        <button id="calcBtn">Calculate Target</button>

        <div id="resultBox" class="result-box">
            <div class="result-title" id="statusText"></div>
            <div class="result-mark" id="markText"></div>
            <div class="result-message" id="messageText"></div>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
